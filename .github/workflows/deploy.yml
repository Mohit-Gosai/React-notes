name: Deploy to GitHub Pages

on:
  push:
    branches: "main"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build_site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Debug node modules and vite temp config
        run: |
          echo "--- node_modules/@vitejs ---"
          ls -la node_modules/@vitejs || true
          echo "--- node_modules/.vite-temp (if present) ---"
          ls -la node_modules/.vite-temp || true
          echo "--- dump .vite-temp vite configs (first 200 lines) ---"
          if [ -d node_modules/.vite-temp ]; then
            for f in node_modules/.vite-temp/*.mjs; do
              echo "== file: $f ==";
              sed -n '1,200p' "$f" || true;
            done
          else
            echo "no .vite-temp directory"
          fi
      - name: Build
        run: npm run build
      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build_site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4